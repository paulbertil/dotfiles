# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Set prefix to Ctrl + a
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# Use Vim-style pane navigation with prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# Resize with prefix (Ctrl-a) + Arrow keys
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
# Status bar colors
set -g status-bg black
set -g status-fg white

# Current window - bright and obvious
set-window-option -g window-status-current-format ' #I:#W '
set-window-option -g window-status-current-style 'fg=black,bg=green,bold'

# Inactive windows
set-window-option -g window-status-format ' #I:#W '
set-window-option -g window-status-style 'fg=white,bg=black'

# Separator between windows
set-window-option -g window-status-separator ''
set -g mouse on


