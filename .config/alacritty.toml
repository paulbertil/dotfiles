[window]
decorations = "None"

[window.padding]
x = 10
y = 10

[font.normal]
family = "MonoLisa Nerd Font Mono"

[cursor.style]
shape = "Block"
blinking = "Always"

[selection]
save_to_clipboard = true

[scrolling]
history = 10000
multiplier = 3


[colors.primary]
background = '#0A0E15'
foreground = '#B3B1AD'

[colors.normal]  
black = '#01060E'
red = '#EA6C73'
green = '#91B362'
yellow = '#F9AF4F'
blue = '#53BDFA'
magenta = '#FAE994'
cyan = '#90E1C6'
white = '#C7C7C7'


[colors.bright]
black = '#686868'
red = '#F07178'
green = '#C2D94C'
yellow = '#FFB454'
blue = '#59C2FF'
magenta = '#FFEE99'
cyan = '#95E6CB'
white = '#FFFFFF'
